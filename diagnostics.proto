syntax = "proto3";
package mirihi.diagnostics;

enum Status {
  UNKNOWN          = 0;
  HEALTHY          = 1;
  ANOMALY_DETECTED = 2;
}

enum Severity {
  NONE   = 0;
  LOW    = 1;
  MEDIUM = 2;
  HIGH   = 3;
}

enum IssueType {
  ISSUE_UNKNOWN       = 0;
  BLIGHT              = 1;
  PEST_INFESTATION    = 2;
  NUTRIENT_DEFICIENCY = 3;
  FUNGAL_INFECTION    = 4;
  VIRAL_INFECTION     = 5;
  WATER_STRESS        = 6;
  OTHER               = 99;   // model flagged something, but it doesn't fit the taxonomy
}

enum NozzleType {
  NOZZLE_OFF    = 0;
  MIST          = 1;
  MEDIUM_SPRAY  = 2;
  HIGH_PRESSURE = 3;
}

message Location {
  double latitude   = 1;
  double longitude  = 2;
  string zone_id    = 3;   // e.g. "ZONE-B4"
  int32  row_id     = 4;   // e.g. Row 12
}

message DiagnosticData {
  IssueType issue_type      = 1;   // constrained — what downstream logic branches on
  string    raw_description = 2;   // unconstrained — what the model actually said, never discarded
  float     confidence      = 3;
  Severity  severity        = 4;
}

message FieldAction {
  bool       trigger_actuator   = 1;
  string     actuator_id        = 2;
  string     treatment_chemical = 3;   // e.g. "Fungicide_CopperMax", "Liquid_NPK_10-10-10"
  float      dosage_ml_per_sqm  = 4;
  bool       isolation_required = 5;
  NozzleType nozzle_setting     = 6;
}

message EdgeCommand {
  string         source_node_id    = 1;
  int64          timestamp_unix_ms = 2;
  Status         status            = 3;
  DiagnosticData diagnostic        = 4;
  FieldAction    field_action      = 5;
  Location       location          = 6;   // Physical farm coordinates where visual was captured
}